name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - uses: actions/stale@v9
        with:
          # Issue settings
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            👋 This issue has been automatically marked as stale because it has not had recent activity.
            
            It will be closed in 7 days if no further activity occurs.
            
            If this issue is still relevant, please leave a comment or remove the stale label.
          close-issue-message: |
            🔒 This issue has been automatically closed due to inactivity.
            
            If you believe this issue is still relevant, please feel free to reopen it.
          
          # PR settings
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            👋 This PR has been automatically marked as stale because it has not had recent activity.
            
            It will be closed in 7 days if no further activity occurs.
            
            If this PR is still relevant, please leave a comment or remove the stale label.
          close-pr-message: |
            🔒 This PR has been automatically closed due to inactivity.
            
            If you believe this PR is still relevant, please feel free to reopen it.
          
          # Exempt labels
          exempt-issue-labels: 'pinned,security,bug: confirmed'
          exempt-pr-labels: 'pinned,security'
          
          # Draft PRs
          exempt-draft-prs: true
