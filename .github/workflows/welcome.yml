name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && github.event.issue.author_association == 'NONE') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.author_association == 'NONE')
    
    steps:
      - name: Welcome new issue creator
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            
            // Check if this is their first issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: author,
              per_page: 1
            });
            
            if (issues.data.length === 1) {
              // First time contributor!
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## 👋 Welcome to Dotstash, @${author}! \n\nThank you for opening your first issue! We really appreciate your feedback.\n\n### 🎯 Quick Tips\n\n1. **Fill out the template**: Please complete all sections in the issue template\n2. **Be specific**: Include steps to reproduce, expected vs actual behavior\n3. **Check existing issues**: Make sure someone hasn't already reported this\n\n### 📚 Helpful Resources\n\n- [Documentation](https://github.com/${context.repo.owner}/${context.repo.repo}#readme)\n- [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)\n- [Code of Conduct](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CODE_OF_CONDUCT.md)\n\n### 🏷️ What Happens Next?\n\n1. A maintainer will review your issue soon\n2. We may add labels like \`needs-triage\` or \`needs-info\`\n3. We'll respond within 48 hours (usually faster!)\n\n---\n\n**First time here?** Check out our [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md) to learn how to get involved!\n\nThank you for helping us improve Dotstash! 🚀`
              });
              
              console.log(`Welcomed new contributor: ${author}`);
            }

      - name: Welcome new PR creator
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            
            // Check if this is their first PR
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              author: author,
              per_page: 1
            });
            
            if (pulls.data.length === 1) {
              // First time contributor!
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## 🎉 Welcome to Dotstash, @${author}! \n\nThank you for your first pull request! We're excited to have you contribute.\n\n### ✅ PR Checklist\n\nBefore we can merge, please make sure:\n\n- [ ] Code follows the project's style guidelines\n- [ ] Tests pass (if applicable)\n- [ ] Documentation is updated (if needed)\n- [ ] Commit messages are clear and descriptive\n\n### 📚 Helpful Resources\n\n- [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)\n- [Code Style Guide](https://github.com/${context.repo.owner}/${context.repo.repo}#code-style)\n- [Development Setup](https://github.com/${context.repo.owner}/${context.repo.repo}#development-setup)\n\n### 🔄 What Happens Next?\n\n1. **Automated checks**: CI/CD will run tests and linting\n2. **Code review**: A maintainer will review your changes\n3. **Feedback**: We may request changes or improvements\n4. **Merge**: Once approved, we'll merge your PR!\n\n### 💡 Tips for Success\n\n- Keep PRs focused on a single change\n- Write clear commit messages\n- Respond to review feedback promptly\n- Be patient - we'll review as soon as we can!\n\n---\n\n**New to open source?** Read our [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md) for tips on making great contributions!\n\nThank you for contributing to Dotstash! 🚀`
              });
              
              console.log(`Welcomed new contributor: ${author}`);
            }

      - name: Add welcome label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            
            // Add welcome label for first-time contributors
            if (issue.author_association === 'NONE' || issue.author_association === 'FIRST_TIME_CONTRIBUTOR') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['welcome', 'first-contribution']
              });
              
              console.log('Added welcome label');
            }
