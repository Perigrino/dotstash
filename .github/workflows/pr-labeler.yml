name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Auto-label PR based on files changed
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            
            // Title-based labels
            const labels = [];
            
            if (title.includes('feat') || title.includes('add') || title.includes('new')) {
              labels.push('enhancement');
            }
            
            if (title.includes('fix') || title.includes('bug') || title.includes('patch')) {
              labels.push('bug');
            }
            
            if (title.includes('doc') || title.includes('readme')) {
              labels.push('documentation');
            }
            
            if (title.includes('test')) {
              labels.push('tests');
            }
            
            if (title.includes('refactor') || title.includes('cleanup')) {
              labels.push('refactor');
            }
            
            if (title.includes('chore') || title.includes('ci') || title.includes('build')) {
              labels.push('chore');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labels
              });
              console.log(`Added labels: ${labels.join(', ')}`);
            }

      - name: Add size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 10
          s_max_size: 100
          m_max_size: 500
          l_max_size: 1000
          fail_if_xl: false
